name: Publish Package to npmjs

on:
  push:
    branches:
      - dev
    tags:
      - '*.*.*'
      - '!**-*'
      - '!v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5
      # Setup .npmrc file to publish to npm
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@kofeinstyle'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set development version
        if: github.ref == 'refs/heads/dev'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo 'The source package version must be a stable semver version.' >&2
            exit 1
          fi
          npm version "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-dev.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version

      - name: Verify stable release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package imports
        run: npm run verify:import

      - name: Verify npm package contents
        run: npm pack --dry-run

      - name: Publish stable release to npm
        if: startsWith(github.ref, 'refs/tags/')
        run: npm publish --provenance --access public

      - name: Publish development build to npm
        if: github.ref == 'refs/heads/dev'
        run: npm publish --provenance --access public --tag dev
